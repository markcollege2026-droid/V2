name: Build Android APK From Scratch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build inside the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4.2.2

    - name: Initialize Environment JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Initialize Gradle Environment Tools
      uses: gradle/actions/setup-gradle@v4

    - name: Automatically Structure Project Layouts
      run: |
        # 1. Ensure core application and export package pathways exist
        mkdir -p app/src/main/java/com/campmeds/app/export
        mkdir -p app/src/test/java/com/campmeds/app
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        
        # 2. Safely route loose files if they are sitting on the front porch
        if [ -f XlsxExporter.kt ]; then
          mv XlsxExporter.kt app/src/main/java/com/campmeds/app/export/
        fi
        
        find . -maxdepth 1 -name "*Test.kt" -exec mv {} app/src/test/java/com/campmeds/app/ \;
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/campmeds/app/ \;
        
        # 3. Safely map XML resource assets if loose
        find . -maxdepth 1 -name "ic_launcher*.xml" -exec mv {} app/src/main/res/drawable/ \;
        find . -maxdepth 1 -name "strings.xml" -exec mv {} app/src/main/res/values/ \;
        find . -maxdepth 1 -name "themes.xml" -exec mv {} app/src/main/res/values/ \;
        find . -maxdepth 1 -name "colors.xml" -exec mv {} app/src/main/res/values/ \;
        
        if [ -f AndroidManifest.xml ]; then
          mv AndroidManifest.xml app/src/main/
        fi
        
        # 4. Manifest string safety patch (forces drawable mapping over mipmap flags)
        TARGET_MANIFEST="app/src/main/AndroidManifest.xml"
        if [ -f "$TARGET_MANIFEST" ]; then
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' "$TARGET_MANIFEST"
        fi
        
        echo "Cloud file sweep and path configurations complete!"

    - name: Generate Gradle Wrapper Executable
      run: |
        if [ ! -f gradlew ]; then
          echo "No local wrapper engine detected. Constructing standard Gradle environment..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Authorize Gradle Execution Security
      run: chmod +x gradlew

    - name: Compile Application Production Package
      run: ./gradlew :app:assembleDebug --clean

    - name: Extract Completed Application Package
      uses: actions/upload-artifact@v4
      with:
        name: CampMeds-Prototype-APK
        path: app/build/outputs/apk/debug/app-debug.apk
