name: Restructure and Build Android App

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch uses that name
  workflow_dispatch:

jobs:
  organize-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Loose Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # --- RESTRUCTURE SECTION ---
    - name: Force Valid Android Project Structure
      run: |
        echo "Creating valid Android directory layout..."
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        echo "Moving Source Files..."
        # Safely move any java or kotlin source files found at root
        if ls *.java 1> /dev/null 2>&1; then mv *.java app/src/main/java/; fi
        if ls *.kt 1> /dev/null 2>&1; then mv *.kt app/src/main/java/; fi

        echo "Moving Layout & Resource Files..."
        if ls *layout*.xml 1> /dev/null 2>&1 || ls activity_*.xml 1> /dev/null 2>&1; then
          mv *layout*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
        fi
        
        for val_file in strings.xml styles.xml colors.xml themes.xml; do
          if [ -f "$val_file" ]; then mv "$val_file" app/src/main/res/values/; fi
        done

        if ls *.png 1> /dev/null 2>&1; then mv *.png app/src/main/res/drawable/; fi

        echo "Moving Core Config Manifest..."
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # --- REPAIR MISSING CONFIGS SYSTEM ---
        echo "Ensuring settings.gradle includes the app module..."
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'CampMeds'" >> settings.gradle
        elif [ -f "settings.gradle" ] && ! grep -q ":app" settings.gradle; then
          echo "include ':app'" >> settings.gradle
        fi

        # If a single loose build.gradle exists, map it to the app subproject module
        if [ -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
          echo "Moving build.gradle to app module..."
          mv build.gradle app/
          
          # Create a basic minimal root build.gradle if missing
          echo "// Root build file" > build.gradle
        fi

        echo "Current Workspace Structural Mapping:"
        find . -maxdepth 4 -not -path '*/.*'

    # --- COMPILE SECTION ---
    - name: Set up Gradle Wrapper
      run: gradle wrapper --gradle-version 8.0

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    # Run explicit task list generation first to clear context, then build
    - name: Build Debug APK via App Module
      run: ./gradlew :app:assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
